name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content + pinyin validation
        run: node tools/validate-content.mjs
      - name: Core state, SRS, streak, hearts tests
        run: node tests/core.test.mjs
      - name: Lesson generator + content tests
        run: node tests/lesson.test.mjs
